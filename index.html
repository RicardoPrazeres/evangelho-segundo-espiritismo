<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Evangelho Segundo o Espiritismo — Allan Kardec</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <button class="btn-icon" id="btn-mobile-menu" title="Abrir índice" aria-label="Abrir índice">☰</button>
      <div class="brand-icon">🕊️</div>
      <div>
        <h1 class="brand-title">O Evangelho Segundo o Espiritismo</h1>
        <span class="brand-subtitle">Allan Kardec • Tradução de Guillon Ribeiro</span>
      </div>
    </div>

    <div class="header-search">
      <span class="search-icon">🔍</span>
      <input type="text" id="global-search-input" placeholder="Pesquisar no livro ou perguntar à IA...">
    </div>

    <div class="header-controls">
      <button class="btn-icon" id="btn-font-decrease" title="Diminuir fonte">A-</button>
      <button class="btn-icon" id="btn-font-increase" title="Aumentar fonte">A+</button>
      <button class="btn-icon" id="btn-theme-toggle" title="Alternar tema">🌙</button>
      <button class="btn-ai" id="btn-toggle-ai">
        <span>✨ IA do Evangelho</span>
      </button>
    </div>
  </header>

  <!-- App Main Layout -->
  <div class="app-container">

    <!-- Sidebar / Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>Índice do Livro</h3>
        <input type="text" id="chapter-filter-input" class="chapter-filter" placeholder="Filtrar capítulos...">
      </div>
      <div class="sidebar-list" id="sidebar-list">
        <!-- Chapters loaded via JS -->
      </div>
    </aside>

    <!-- Reader Main Content -->
    <main class="reader-container" id="reader-container">
      <article class="reader-content" id="reader-content">
        <!-- Active Chapter content rendered via JS -->
      </article>
    </main>

    <!-- AI Chat Panel / Drawer -->
    <aside class="chat-drawer collapsed" id="chat-drawer">
      <div class="chat-header">
        <div class="chat-title-group">
          <div class="chat-avatar">IA</div>
          <div>
            <div class="chat-title">Assistente do Evangelho</div>
            <div class="chat-status">Pronto para responder dúvidas</div>
          </div>
        </div>
        <div style="display:flex; gap:0.25rem;">
          <button class="btn-icon" id="btn-chat-settings" title="Configurações da IA">⚙️</button>
          <button class="btn-icon" id="chat-close-btn" title="Fechar painel">✕</button>
        </div>
      </div>

      <!-- Messages Log -->
      <div class="chat-messages" id="chat-messages">
        <!-- Initial greeting rendered via JS -->
      </div>

      <!-- Quick Suggestion Chips -->
      <div class="chip-suggestions" id="chip-suggestions">
        <button class="chip">O que o livro diz sobre a vida futura?</button>
        <button class="chip">O que significa 'Fora da caridade não há salvação'?</button>
        <button class="chip">Qual a causa das aflições segundo Kardec?</button>
        <button class="chip">O que o livro ensina sobre o perdão aos inimigos?</button>
      </div>

      <!-- Chat Input Area -->
      <div class="chat-input-area">
        <input type="text" id="chat-input" class="chat-input" placeholder="Faça uma pergunta sobre o livro...">
        <button class="btn-send" id="chat-send-btn" title="Enviar mensagem">➤</button>
      </div>
    </aside>

  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-box">
      <h3 class="modal-title">Configurações da IA do Livro</h3>
      
      <div class="form-group">
        <label for="select-ai-provider">Provedor de Inteligência Artificial:</label>
        <select id="select-ai-provider" class="form-control">
          <option value="auto">Busca Contextual Inteligente (Modo RAG Integrado)</option>
          <option value="gemini">Google Gemini API (Com chave própria)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="input-gemini-key">Chave da API do Google Gemini (Opcional):</label>
        <input type="password" id="input-gemini-key" class="form-control" placeholder="Cole sua API Key aqui se desejar usar Gemini ao vivo...">
        <small style="color:var(--text-secondary); display:block; margin-top:4px; font-size:0.75rem;">
          Caso não informe a chave, o sistema funcionará com o motor RAG inteligente local embarcado no site.
        </small>
      </div>

      <div class="modal-actions">
        <button class="btn-nav" id="modal-close-settings">Cancelar</button>
        <button class="btn-ai" id="modal-save-settings">Salvar Configurações</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/book-data.js"></script>
  <script src="js/ai-chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
